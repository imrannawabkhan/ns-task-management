version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:24.16
      - image: cimg/postgres:18.4
        environment:
          POSTGRES_USER: nestdbu2026
          POSTGRES_DB: nestdb
          POSTGRES_PASSWORD: jpxOJhB6NQ345mO
    steps:
      - checkout

      # Install dependencies using Yarn with caching for speed
      - restore_cache:
          keys: data-deps-{{ checksum "yarn.lock" }}
            data-deps-

      - run:
          name: Install Dependencies (Yarn)
          command: yarn install --frozen-lockfile

      - save_cache:
          paths:
            - node_modules
          key: data-deps-{{ checksum "yarn.lock" }}

      # Run Linter & Tests (optional: adjust flags if needed)
      - run:
          name: Run Linter
          command: yarn lint || true

      - run:
          name: Run Tests
          command: yarn test || true

      # Build NestJS App (Generates /dist folder)
      - run:
          name: Build Application
          command: yarn build

      # Pass built files to the deployment job
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - package.json
            - yarn.lock

  deploy:
    docker:
      - image: cimg/node:24.16
    steps:
      - checkout
      - attach_workspace:
          at: .

      # OPTION 1: Example deployment using SSH (VPS/EC2/DigitalOcean)
      # Make sure to add your SSH Key fingerprint and environment variables in CircleCI UI
      - add_ssh_keys:
          fingerprints:
            - 'YOUR_SSH_KEY_FINGERPRINT'
      - run:
          name: Deploy over SSH
          command: |
            ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd /path/to/app && git pull && yarn install --production && yarn build && pm2 restart main"

      # OPTION 2: If deploying via Docker instead, comment out SSH above and use this:
      # - setup_remote_docker
      # - run:
      #     name: Build and Push Docker Image
      #     command: |
      #       echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
      #       docker build -t $DOCKER_USER/nestjs-app:latest .
      #       docker push $DOCKER_USER/nestjs-app:latest

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build-and-test
      - deploy:
          requires:
            - build-and-test
          # Deploys > ns-production-env > Settings > Environment Integration Settings
          # context: ns-production-env
          filters:
            branches:
              only: main # Triggers deployment automatically on push/merge to main
